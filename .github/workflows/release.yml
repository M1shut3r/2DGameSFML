name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ make \
            libsfml-dev libopenal-dev \
            patchelf pkg-config \
            file curl libfuse2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        env:
          MAKE_APPIMAGE: "1"
        run: |
          chmod +x scripts/package-linux.sh
          version="${{ github.event.inputs.version || github.ref_name }}"
          version="${version#v}"
          ./scripts/package-linux.sh build dist "$version"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/2DGameSFML-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/2DGameSFML-linux-x86_64.AppImage
          if-no-files-found: warn

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SFML
        shell: pwsh
        run: |
          $url = "https://github.com/SFML/SFML/releases/download/2.6.2/SFML-2.6.2-windows-vc17-64-bit.zip"
          Invoke-WebRequest -Uri $url -OutFile sfml.zip
          Expand-Archive sfml.zip -DestinationPath .

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="${{ github.workspace }}/SFML-2.6.2"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -BuildDir build -DistDir dist -SfmlBin "${{ github.workspace }}/SFML-2.6.2/bin"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/2DGameSFML-windows-x64.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: release/*
          body: |
            Готовые сборки — Visual Studio ставить не нужно.

            **Windows:** скачайте `2DGameSFML-windows-x64.zip`, распакуйте и запустите `2DGameSFML.exe`.
            **Linux:** скачайте AppImage или архив `.tar.gz` и запустите игру.

            - Left click — направить мяч
            - Серый квадрат — цель уровня
            - Иконки слева сверху — звук, следующий трек, сброс
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
